<section class="bg-white py-6">
  <div class="my-10 flex gap-6 justify-center items-center flex-wrap wow fadeInUp">
    <h2 class="text-dark mb-0 text-3xl font-bold sm:text-4xl md:text-[40px] editable text-right pr-6 border-r border-slate-500" id="secadsfww2">IMPROVE GENERAL <br> RIDEABILITY</h2>
    <h6 class="text-[16px] font-bold spacing-[40px] text-primary" style="letter-spacing: 10px;">PERFORMANCE</h6>
  </div>
  <div class="container mx-auto px-4">
    <div class="swiper" id="category-swiper">
      <div class="swiper-wrapper">
        {% for sec in sections %}
        <div class="swiper-slide w-full sm:w-1/2 lg:w-1/6 wow fadeInRight" data-wow-delay="{{forloop.counter}}00ms">
          <a href="/search_page?section={{sec.id}}" class="group mb-10 block text-center">
            <div class="mb-5 overflow-hidden rounded-lg">
              {% if sec.image %}
              <img src="{{sec.image.url}}" alt="category" class="cat-image w-[240px] h-[168px] m-auto object-cover bg-slate-50 hover:shadow" />
              {% else %}
              <img src="/static/frontend/images/no_product.png" alt="category" class="cat-image w-[240px] h-[168px] m-auto object-cover border border-slate-50 hover:shadow" />
              {% endif %}
            </div>
            <h3 class="group-hover:text-primary mb-1 text-xl font-semibold text-black md:text-2xl lg:text-xl xl:text-2xl">{{sec.name}}</h3>
          </a>
        </div>
        {% endfor %}
      </div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
      <div class="swiper-pagination"></div>
    </div>
    </div>
  </div>
</section>

<style scoped>
  @media(max-width:425px){
    .cat-image{
      width: 100%;
    }
  }
</style>
