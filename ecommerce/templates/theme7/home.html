<script>
	createApp({
	  data() {
		return {
		  store: store,
		  subscribeEmail: '',
		  subscribed: false,
		}
	  },
	  delimiters: ['[[', ']]'],
  
	  methods: {
		subscribe() {
		  if (this.subscribeEmail) {
			fetch('/api/subscribe', {
			  method: 'POST',
			  headers: {
				'Content-Type': 'application/json'
			  },
			  body: JSON.stringify({
				email: this.subscribeEmail
			  })
			})
			.then(response => response.json())
			.then(data => {
			  this.subscribed = true;
			})
			.catch(error => console.error(error));
		  }
		},
	  },
	}).use(store).mount('#subscribe')
  </script>
