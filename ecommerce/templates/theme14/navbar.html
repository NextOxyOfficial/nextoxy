{% load static %}
<div class="w-screen" id="navbar">
  <div class="w-full ">
    <span style="font-family: Futura;"
      class="block text-center bg-[#1c1c1c] w-full text-white border-b-[1px] border-gray-700 font-normal tracking-wide py-2 px-[20px] text-[14px] md:text-base">Free
      shipping and returns
    </span>
    <div class="w-full bg-[#1c1c1c]">
      <div class="max-w-[1300px] mx-auto flex items-center justify-between px-[20px] py-3 lg:py-[30px] lg:px-[40px] gap-3">
        <div class="flex items-center gap-3 md:gap-6">
          <!-- hamburgur -->
          <div id="toggleMenu" class="flex items-center justify-start lg:hidden">
            <div
              class="w-6 h-0.5 bg-white rounded-full before:content-[''] before:absolute before:w-6 before:h-0.5 before:bg-white before:rounded-full before:-translate-y-2 after:absolute after:w-6 after:h-0.5 after:bg-white after:rounded-full after:translate-y-2">
            </div>
          </div>
          {% if shop.logo %}
          <a href="/" class="block w-full py-5 lg:py-3"><img src="{{shop.logo.url}}" alt="logo"
              class="max-h-[30px] md:max-h-[45px] object-contain bg-white rounded p-1" /></a>
          {% else %}
          <a href="/"><img src="{% static '/ecommerce/logo.png' %}" alt="logo" class="h-[40px] md:h-[62px]" /></a>
          {% endif %}
        </div>
        <ul class="hidden lg:flex items-center justify-center gap-2 ">
          {% for menu in main_menu %}
          <li style="font-family: Futura;"
            class="py-[7.5px] px-[15px] text-[18px] whitespace-nowrap text-center text-white tracking-wide">
            <a href="/page/{{menu.link}}"> {{menu.name}} </a>
          </li>
          {% endfor %}
        </ul>
        <div class="flex items-center justify-center text-white">
          <!--search-->
          <div class="relative hidden lg:inline-block">
            <input v-model="searchTerm" @keydown.enter="goToUrl('/search_page?search='+searchTerm)" type="text"
              placeholder="I'm shopping for..."
              class=" text-body-color border-[1px] w-full bg-transparent py-3 pl-6 pr-[58px] text-base font-medium outline-none" />
            <a :href="'/search_page?search='+searchTerm"
              class="absolute right-0 top-1 h-[45.45px]  py-[7.5px] px-[12px]">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 256 256">
                <path fill="currentColor"
                  d="m229.66 218.34l-50.07-50.06a88.11 88.11 0 1 0-11.31 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32ZM40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72Z" />
              </svg>
            </a>
          </div>

          <!--user-->
          <a class="py-[3px] px-[6px] md:py-[7.5px] md:px-[12px]" href="/my_account">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24">
              <path fill="currentColor"
                d="M12 5.9a2.1 2.1 0 1 1 0 4.2a2.1 2.1 0 0 1 0-4.2m0 9c2.97 0 6.1 1.46 6.1 2.1v1.1H5.9V17c0-.64 3.13-2.1 6.1-2.1M12 4C9.79 4 8 5.79 8 8s1.79 4 4 4s4-1.79 4-4s-1.79-4-4-4zm0 9c-2.67 0-8 1.34-8 4v3h16v-3c0-2.66-5.33-4-8-4z" />
            </svg>
          </a>
          <!--wish-->
          <a href="/wishlist" class="relative py-[3px] px-[6px] md:py-[7.5px] md:px-[12px]">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24">
              <path fill="currentColor"
                d="m12 21l-1.45-1.3q-2.525-2.275-4.175-3.925T3.75 12.812Q2.775 11.5 2.388 10.4T2 8.15Q2 5.8 3.575 4.225T7.5 2.65q1.3 0 2.475.55T12 4.75q.85-1 2.025-1.55t2.475-.55q2.35 0 3.925 1.575T22 8.15q0 1.15-.388 2.25t-1.362 2.412q-.975 1.313-2.625 2.963T13.45 19.7L12 21Zm0-2.7q2.4-2.15 3.95-3.688t2.45-2.674q.9-1.138 1.25-2.026T20 8.15q0-1.5-1-2.5t-2.5-1q-1.175 0-2.175.662T12.95 7h-1.9q-.375-1.025-1.375-1.688T7.5 4.65q-1.5 0-2.5 1t-1 2.5q0 .875.35 1.763t1.25 2.025q.9 1.137 2.45 2.675T12 18.3Zm0-6.825Z" />
            </svg>
            <span
              class="bg-primary absolute -top-1 -right-1 flex h-[20px] w-[20px] items-center justify-center rounded-full text-[12px] font-semibold text-white">
              [[store.state.wish.length]] </span>
          </a>

          <!--cart-->
          <a href="/cart" @click="cartOpen = !cartOpen" class="relative py-[3px] px-[6px] md:py-[7.5px] md:px-[12px]">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 256 256">
              <path fill="currentColor"
                d="M96 216a16 16 0 1 1-16-16a16 16 0 0 1 16 16Zm88-16a16 16 0 1 0 16 16a16 16 0 0 0-16-16Zm47.65-125.65l-28.53 92.71A23.89 23.89 0 0 1 180.18 184H84.07A24.11 24.11 0 0 1 61 166.59L24.82 40H8a8 8 0 0 1 0-16h16.82a16.08 16.08 0 0 1 15.39 11.6L48.32 64H224a8 8 0 0 1 7.65 10.35ZM213.17 80H52.89l23.49 82.2a8 8 0 0 0 7.69 5.8h96.11a8 8 0 0 0 7.65-5.65Z" />
            </svg>
            <span
              class="bg-primary absolute -top-1 -right-1 flex h-[20px] w-[20px] items-center justify-center rounded-full text-[12px] font-semibold text-white">
              [[store.state.cart.length]] </span>
          </a>
        </div>
      </div>
    </div>
  </div>
  <div class="max-w-[1300px] mx-auto flex items-center justify-center my-2 lg:hidden">
    <!--search-->
    <div class="relative inline-block lg:hidden w-full  px-[20px] lg:px-[40px]">
      <input v-model="searchTerm" @keydown.enter="goToUrl('/search_page?search='+searchTerm)" type="text"
        placeholder="I'm shopping for..."
        class=" text-white border-[1px] w-full bg-transparent py-2 sm:py-3 px-6 text-base font-medium outline-none" />
      <a :href="'/search_page?search='+searchTerm" class="absolute right-[10%] sm:right-[5%] top-[20%]  ">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 256 256">
          <path fill="black"
            d="m229.66 218.34l-50.07-50.06a88.11 88.11 0 1 0-11.31 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32ZM40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72Z" />
        </svg>
      </a>
    </div>
  </div>
</div>

<script>
  const { createApp } = Vue
  const app = createApp({
    data() {
      return {
        category: false,
        store: store,
        menuToggle: false,
        searchTerm: '',
      }
    },
    delimiters: ['[[', ']]'],
    methods: {
      addToCart(item) {
        this.$store.commit('addToCart', item)
      },
      delFromCart(item) {
        this.$store.commit('removeFromCart', item)
      },
      closeCartItem(item) {
        this.delFromCart(item)
        item.close = true
        this.addToCart(item)
      },
      goToCart() {
        for (let i = 0; i < this.store.state.cart.length; i++) {
          const item = this.store.state.cart[i];
          this.closeCartItem(item)
        }
        window.location.href = '/cart'
      },
      goToUrl(url) {
        window.location.href = url
      }
    },
  })
  app.use(store)
  app.mount('#navbar')
</script>

{% comment %}
<script>
  window.onscroll = function () { stickyheader() };
  var header = document.getElementById("navbarmenu");
  var sticky = header.offsetTop;

  function stickyheader() {
    if (window.pageYOffset > sticky) {
      header.classList.add("sticky");
    } else {
      header.classList.remove("sticky");
    }
  }
</script> {% endcomment %}
