<!-- collection list -->
<div class="max-w-[1300px] mx-auto px-[20px] md:px-[40px] mt-12 md:mt-24 mb-20 lg:mb-44">

                        <div class="absolute bottom-5 left-4 h-0.5 w-0 group-hover:w-[224px] transition-all duration-500 bg-white"></div>
