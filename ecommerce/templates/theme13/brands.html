<section class="bg-white py-12">
    <div class="max-w-[1600px] px-[15px] md:px-[50px] mx-auto">
        <h2 style="font-family: 'Playfair Display', serif;" class="editable text text-[24px] font-bold mb-[30px]">Popular Brands</h2>
      <div class="flex flex-wrap">
        <div class="swiper" id="product-images-swiper">
          <div class="swiper-wrapper">
            {% for brand in brands %}
            {% if brand.image %}

            <a href="/search_page?brand={{brand.id}}" data-wow-delay="{{forloop.counter}}00ms" class="wow fadeInRight swiper-slide flex gap-4 h-24 min-w-[150px] w-[225px] object-contain items-center justify-center border border-transparent px-7">
              <img src="{{brand.image.url}}" alt="image" class="h-24 max-w-full object-contain"/>
            </a>

            {% endif %}
            {% endfor %}
          </div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>
          <div class="swiper-pagination"></div>
        </div>
      </div>
    </div>
  </section>
