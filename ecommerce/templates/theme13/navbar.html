<script>
  const { createApp } = Vue
  const app = createApp({
    data() {
      return {
        category: false,
        store: store,
        menuToggle: false,
        searchTerm: '',
      }
    },
    delimiters: ['[[', ']]'],
    methods: {
      addToCart(item) {
        this.$store.commit('addToCart',item)
      },
      delFromCart(item){
        this.$store.commit('removeFromCart',item)
      },
      closeCartItem(item){
        this.delFromCart(item)
        item.close = true
        this.addToCart(item)
      },
      goToCart(){
        for (let i = 0; i < this.store.state.cart.length; i++) {
          const item = this.store.state.cart[i];
          this.closeCartItem(item)
        }
        window.location.href = '/cart'
      },
      goToUrl(url){
        window.location.href = url
      }
    },
  })
  app.use(store)
  app.mount('#navbar')
</script>

{% comment %} <script>
  window.onscroll = function() {stickyheader()};
  var header = document.getElementById("navbarmenu");
  var sticky = header.offsetTop;

  function stickyheader() {
      if (window.pageYOffset > sticky) {
      header.classList.add("sticky");
      } else {
      header.classList.remove("sticky");
      }
  }
</script> {% endcomment %}


<style>
  #navbarmenu.sticky{
    position: fixed;
    z-index: 9999;
    background-color: #fff;
    max-width: 100% ;
    width: 100% ;
    top: 0px !important;
  }
</style>
