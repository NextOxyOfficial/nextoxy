<div class="mx-auto max-w-[1870px] px-4 md:px-6 lg:px-8 2xl:px-20 mb-[60px]" id="">
  <div class="mb-6 lg:mb-8">
    <div class=" mb-6 block-title">
      <h2 class="text-skin-base text-[20px] xl:text-[20px] font-medium xl:leading-8">
        <div class="">Shop By <span class="font-light">Categories</span></div>
      </h2>
    </div>
    <div class="mt-0">
      <div class="swiper" id="product-cat-swiper">
        <div class="swiper-wrapper w-full">
          {% for sec in sections %}
          <div class="swiper-slide pr-4 wow fadeInUp" data-wow-delay="{{forloop.counter}}00ms w-full bg-black">
            
            <a class="group items-center px-0 transition" href="/search_page?section={{sec.id}}">
              <div class="w-full" style="display:block;overflow:hidden;position:relative;box-sizing:border-box;margin:0">
                <div style="display:block;box-sizing:border-box;padding-top:62.745098039215684%">
                {% if sec.image %}
                <img class="bg-sink-thumbnail object-cover transition duration-200 ease-in-out transform group-hover:opacity-80 w-full" alt="Audio Music"
                  src="{{sec.image.url}}"
                  decoding="async" data-nimg="responsive"
                  style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"
                  sizes="(max-width: 768px) 15vw,10vw"
                >
                {% else %} 
                <img class="bg-sink-thumbnail object-cover transition duration-200 ease-in-out transform group-hover:opacity-80" alt="Audio Music"
                  src="/static/ecommerce/no_product.png"
                  decoding="async" data-nimg="responsive"
                  style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"
                  sizes="(max-width: 768px) 15vw,10vw"
                >
                {% endif %} 
              </div>
              </div>
            </a>
            <h3 class="pt-5 text-[16px] text-skin-base capitalize  font-medium hover:text-skin-primary">
              <a href="/search_page?category={{sec.id}}">{{sec.name}}</a>
            </h3>
            <ul class="py-3 text-[14px] leading-6">
              {% for sub in sec.category_set.all %}
              <li class="pb-1 hover:text-skin-primary"><a href="/search_page?category={{sub.id}}">{{sub.name}}</a></li>
              {% endfor %}
              
            </ul>
          </div>
          {% endfor %}
        </div> 
        
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-pagination"></div>
      </div>
          
    </div>
  </div>
</div>
