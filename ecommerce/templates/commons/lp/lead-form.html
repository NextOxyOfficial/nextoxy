<form
  method="post"
  action="/submit-lead-form"
  class="flex flex-col gap-5 max-w-md"
>
  {% csrf_token %}
  <div>
    <!-- <label
			for="name"
			class="block text-sm font-medium text-gray-700"
			>Name</label
		> -->
    <input
      type="text"
      id="name"
      name="name"
      required
      placeholder="Full Name"
      class="w-full border py-2.5 px-3 border-gray-300 shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md"
    />
  </div>
  <div>
    <!-- <label for="email" class="block text-sm font-medium text-gray-700"
      >Email</label
    > -->
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Email Address"
      required
      class="w-full border py-2.5 px-3 border-gray-300 shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md"
    />
  </div>

  <div>
    <!-- <label for="email" class="block text-sm font-medium text-gray-700"
      >Email</label
    > -->
    <input
      type="text"
      id="phone"
      name="phone"
      placeholder="Phone"
      required
      class="w-full border py-2.5 px-3 border-gray-300 shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md"
    />
  </div>
  <div>
    <!-- <label for="message" class="block text-sm font-medium text-gray-700"
      >Message</label
    > -->
    <textarea
      id="message"
      name="message"
      rows="4"
      required
      class="w-full border py-2.5 px-3 border-gray-300 shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md"
    ></textarea>
  </div>
  <div>
    <button
      type="submit"
      class="editable text py-3 w-full bg-[#2B8761] text-white px-4 shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 font-semibold rounded-md"
    >
      Get Quote
    </button>
  </div>
</form>
