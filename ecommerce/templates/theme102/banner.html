    <section class="py-6 ">
        <div class="container mx-auto px-6">
          <div class="flex flex-wrap gap-y-8">
            {% for banner in banners %}
            <div class="w-full md:w-1/2 bg-gray-100 border">
              <div class="relative overflow-hidden rounded-xl py-6 px-4 sm:px-10 lg:py-[40px] flex flex-col sm:flex-row " >
                <img class="relative right-0 top-6 bottom-0 w-full h-full object-contain sm:absolute sm:w-2/4" src="{{banner.image.url}}" alt="Banner"/>
  
                <div class="z-1 relative w-full sm:w-2/3 lg:w-3/4 xl:w-1/2">
                  <h4 class="mb-3 text-lg font-semibold text-black">
                    {{banner.title}}
                  </h4>
                  <h2 class="text-xl font-bold text-black lg:text-3xl">
                    {{banner.content}}
                  </h2>
                  <a href="{{banner.button_link}}" target="_blank" class="mt-8 inline-flex items-center gap-3 font-medium text-black hover:text-primary xl:mt-[70px]" >
                    {{banner.button_text}}
                    <svg width="24" height="24"  viewBox="0 0 24 24"  fill="none"  xmlns="http://www.w3.org/2000/svg" >
                      <path d="M21.6 11.4L13.8375 3.525C13.5 3.1875 12.975 3.1875 12.6375 3.525C12.3 3.8625 12.3 4.3875 12.6375 4.725L18.9375 11.1375H2.99999C2.54999 11.1375 2.17499 11.5125 2.17499 11.9625C2.17499 12.4125 2.54999 12.825 2.99999 12.825H19.0125L12.6375 19.3125C12.3 19.65 12.3 20.175 12.6375 20.5125C12.7875 20.6625 13.0125 20.7375 13.2375 20.7375C13.4625 20.7375 13.6875 20.6625 13.8375 20.475L21.6 12.6C21.9375 12.2625 21.9375 11.7375 21.6 11.4Z" fill="currentColor"/>
                    </svg>
                  </a>
                </div>
              </div>
            </div>
            {% endfor %}
