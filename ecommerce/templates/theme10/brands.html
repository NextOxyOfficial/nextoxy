<div class="holder holder-mt-medium">
    <div class="container">
        <ul class="brand-grid flex-wrap justify-content- js-color-hover-brand-grid  wow fadeInLeft" data-wow-delay="{{forloop.counter}}100ms">
            {% for brand in brands %}

            <li>
                <a  href="/search_page?brand={{brand.id}}" target="_self" class="d-block image-container" title="Brand">
                    <img class="lazyload fade-up"
                    src="{{brand.image.url}}"
                    data-src="{{brand.image.url}}" alt="Brand">
                </a>
            </li>

            {% endfor %}

        </ul>
   
    </div>
</div>
