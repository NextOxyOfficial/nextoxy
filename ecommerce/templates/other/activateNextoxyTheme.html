<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate theme</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <section class="bg-indigo-600 relative z-10 py-[120px] h-screen">
        <div class="container mx-auto ">
          <div class="-mx-4 flex">
            <div class="w-full px-4">
              <div class="mx-auto max-w-[700px] text-center bg-slate-50/10 p-10 rounded shadow">
                <h3
                  class="mb-6 border-b pb-1 text-[40px] font-bold leading-none text-white"
                >
                  Activate Theme
                </h3>
                <h4 class="mb-3 text-[22px] font-semibold leading-tight text-white">
                  One More Step To Publish Your Shop
                </h4>
                <p class="mb-8 text-lg text-white">
                    You have successfully created your shop. Now you need to choose and
                    activate the theme to publish your shop.
                </p>
                <a
                  href="http://nextoxy.com/ecommerce/themes"
                  class="hover:text-primary inline-block rounded-lg border border-white px-8 py-3 text-center text-base font-semibold text-white transition hover:shadow-lg"
                >
                  Go To Dashboard
                </a>
                <a
                  href="/"
                  class="hover:text-primary inline-block rounded-lg border border-white px-8 py-3 text-center text-base font-semibold text-white transition hover:shadow-lg"
                >
                  Refresh
                </a>
              </div>
            </div>
          </div>
        </div>
        <div
          class="absolute top-0 left-0 -z-10 flex h-full w-full items-center justify-between space-x-5 md:space-x-8 lg:space-x-14"
        >
          <div
            class="h-full w-1/3 bg-gradient-to-t from-[#FFFFFF14] to-[#C4C4C400]"
          ></div>
          <div class="flex h-full w-1/3">
            <div
              class="h-full w-1/2 bg-gradient-to-b from-[#FFFFFF14] to-[#C4C4C400]"
            ></div>
            <div
              class="h-full w-1/2 bg-gradient-to-t from-[#FFFFFF14] to-[#C4C4C400]"
            ></div>
          </div>
          <div
            class="h-full w-1/3 bg-gradient-to-b from-[#FFFFFF14] to-[#C4C4C400]"
          ></div>
        </div>
      </section>
  
</body>
</html>
