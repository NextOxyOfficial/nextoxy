<div id="cupon" class="discount-banner flex h-[307px] w-full items-center justify-center bg-cover mb-20" style='background: url("/static/ecommerce/theme2/discount-banner-1.jpg") 0% 0% / cover no-repeat;'>
    <div>
      <div data-aos="fade-up" class="aos-init aos-animate">
        <h1 class="font-700 text-qblack mb-2 text-center text-xl sm:text-3xl editable text" id="homecuppon234">Get <span class="text-qyellow mx-1">20%</span> Off Discount Coupon</h1>
        <p class="font-400 text-center text-sm sm:text-[18px] editable text" id="homecuppon34534">by Subscribe our Newsletter</p>
      </div>
      <div data-aos="fade-right" class="aos-init mt-8 flex h-[54px] w-[300px] sm:w-[543px]">
        <div class="focus-within:text-qyellow text-qblack flex h-full flex-1 items-center space-x-2 bg-white pl-4">
          <span
            ><svg width="17" height="15" viewBox="0 0 17 15" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 14H2C1.4 14 1 13.6 1 13V2C1 1.4 1.4 1 2 1H15C15.6 1 16 1.4 16 2V13C16 13.6 15.6 14 15 14Z" stroke="currentColor" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="M3 4L8.5 8.5L14 4" stroke="currentColor" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"></path></svg></span
          ><input  v-model="subscribeEmail" type="email" name="email" class="placeholder:text-qblack text-qblack font-400 h-full w-full text-sm tracking-wider placeholder:text-xs focus:outline-none" placeholder="EMAIL ADDRESS" />
        </div>
        <button @click="subscribe" type="button" class="bg-qyellow font-600 h-full w-[80px] text-sm sm:w-[158px] editable text" id="homecuppon23234s">
          <span v-if="subscribed">Subscribed!</span>
          <span v-else >Get the Coupon</span>
        </button>
      </div>
    </div>
  </div>

  
  <style scoped>
    .bg-qyellow{
      background-color: rgb255 187 56;
    }
  </style>

<script>
  createApp({
    data() {
      return {
        store: store,
        subscribeEmail: '',
        subscribed: false,
      }
    },
    delimiters: ['[[', ']]'],

    methods: {
      subscribe() {
        if (this.subscribeEmail) {
          fetch('/api/subscribe', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              email: this.subscribeEmail
            })
          })
          .then(response => response.json())
          .then(data => {
            this.subscribed = true;
          })
          .catch(error => console.error(error));
        }
      },
    },
  }).use(store).mount('#cupon')
</script>
