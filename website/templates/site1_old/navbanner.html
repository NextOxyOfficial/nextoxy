<section class="container m-auto py-8" id="navbar">
    <div class="flex justify-between mx-4" style="align-items: center;">
        <div class="flex gap-2 items-center">
            <div>
                <svg class="sm:hidden h-8 w-8 text-black" fill="yes" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" />
                </svg>
            </div>
            <a class=" focus:outline-none " href="/">
                <img alt="Upload" srcset="" src="{{shop.logo.url}}" decoding="async" data-nimg="fixed" class="h-8" />
            </a>
        </div>
        <ul class="sm:flex hidden gap-4">
            {% for menu in main_menu %}
            <li>
                <a href="#">{{menu.name}}</a>
            </li>
            {% endfor %}
        </ul>
        <button class="bg-red-500 text-white sm:px-6 px-2 text-center rounded-xl  py-2 sm:text-base text-sm">
            অর্ডার করতে চাই
        </button>
    </div>
</section>

<script>
createApp({
  data() {
    return {
      toggleMenu: false
    }
  }
}).mount('#navbar')
</script>
