<body>
    {% include "blog1/navbar.html" %}
    {% block content %} 
    {% endblock content %}
    {% include "blog1/footer.html" %}

    <button onclick="topFunction()" id="topScrollBtn" title="Go to top" class="fixed hidden bottom-[20px] right-[30px] z-[999] text-white bg-black cursor-pointer sm:w-[60px] w-[40px] rounded-full sm:h-[60px] h-[40px]">
        <div class="arrow">
            <span></span>
            <span></span>
        </div>
    </button>

</body>
</html>
<style>
    html {
        scroll-behavior: smooth;
    }

    body{
        font-family: 'Playfair Display', serif !important;
    }
    .blog2-container{
        max-width: 1320px;
        margin: 0 auto;
        padding: 0 10px;
    }
    .btn-primary{
        background-color: black;
        padding: 10px 20px;
        border-radius: 999px;
        color: #fff;
        font-size: 14px;
    }
    #topScrollBtn  .arrow {
        position: absolute;
        top: 45%;
        left: 45%;
        transform: rotate(180deg);
        cursor: pointer;
    }
    #topScrollBtn  .arrow span {
        display: block;
        width: 15px;
        height: 15px;
        border-bottom: 5px solid white;
        border-right: 5px solid white;
        transform: rotate(45deg);
        margin: -10px;
        animation: topbtnanimate 2s infinite;
    }
    #topScrollBtn  .arrow span:nth-child(2) {
        animation-delay: -0.3s;
    }
    .arrow span:nth-child(3) {
        animation-delay: -0.4s;
    }

    @keyframes topbtnanimate {
        0% {
            opacity: 0;
            transform: rotate(45deg) translate(-10px, -10px);
        }
        50% {
            opacity: 1;
        }
        100% {
            opacity: 0;
            transform: rotate(45deg) translate(0px, 0px);
        }
    }

    .header.sticky{
        position: fixed;
        top: 0px ;
        background: #fff !important;
        width: 100% !important;
        z-index: 9999;
    }
</style>

<script>

    var swiper = new Swiper(".heroSwiper", {  
        autoplay: {
            delay: 3000,
        },
        navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
        },
    });


    let topbtnScroll = document.getElementById("topScrollBtn");
    
    window.onscroll = function() {scrollFunction(), stickheader()};
    
    function scrollFunction() {
      if (document.body.scrollTop > 40 || document.documentElement.scrollTop > 40) {
        topbtnScroll.style.display = "block";
      } else {
        topbtnScroll.style.display = "none";
      }
    }

    var header = document.getElementById("stickyheaders");
    var sticky = header.offsetTop;

    function stickheader() {
    if (window.pageYOffset > sticky) {
        header.classList.add("sticky");
    } else {
        header.classList.remove("sticky");
    }
    }
    
    function topFunction() {
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
    }
</script>
