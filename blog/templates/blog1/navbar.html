<header class="bg-white relative">
  <div id="sidebar" class="sidebar border fixed z-[9999999] left-[-700px] bg-white p-4 h-[100%] sm:max-w-[395px] max-w-[300px] w-full">
    <svg class="absolute right-[-20px] bg-gray-300 cursor-pointer w-[20px] h-[20px]" id="closemenubar" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="#000000" d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41z"/></svg>
  </div>
  <div class="relative">
    <div id="stickyheaders" class="header shadow-sm bg-slate-200/20">
      <div class="max-w-[1320px] w-full mx-auto px-2 py-3">
        <div class="relative flex items-center justify-between">
          <div class="flex gap-4 items-center">
            <svg id="toggleIcon" class="lg:hidden flex" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="none" stroke="#333333" stroke-width="2" d="M2 19h20M2 5h20M2 12h20"/></svg>
            <a href="/">
              asd
              {% if blog.logo %}
              <!-- <img src="{{blog.logo.url}}" class="font-bold text-3xl"> -->
              <img src="{{blog.logo.url}}" alt="">asd
              {% endif %}
            </a>
          </div>

          <!-- menu -->
          <div class="sm:flex items-center justify-between px-4">
            <div class="">
              <nav id="navbarCollapse"  class="menuBox absolute right-4 top-full hidden  justify-center rounded-lg bg-white px-6 py-5 shadow lg:static lg:flex lg:justify-end lg:bg-transparent lg:px-0 lg:py-0 lg:shadow-none">
                <ul class="block items-center lg:flex">
                  
                 
                  <li class="">
                    <a href="/" class="relative text-sm text-dark hover:text-primary flex items-center gap-1 justify-between py-2 text-base font-medium lg:mx-5 lg:inline-flex lg:py-6 2xl:mx-6" style="font-family: 'Open Sans', sans-serif;">  Home </a>
                  </li>
                  <li class="hover-link relative ">
                    <p class="relative cursor-pointer text-sm text-dark hover:text-primary flex items-center gap-1 justify-between py-2 text-base font-medium lg:mx-5 lg:inline-flex lg:py-6 2xl:mx-6" style="font-family: 'Open Sans', sans-serif;">  Categories <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m6 9l6 6l6-6"/></svg></p>
                      <div class="link absolute top-[58px] opacity-0 z-[-0] max-w-[340px] shadow-sm w-full left-0 bg-white inline-block text-left">
                        <div class="rounded py-5">
                          {% for cat in category %}
                          <a href="/categories/{{cat.id}}/" style="font-family: 'Open Sans', sans-serif;" class="text-body-color hover:bg-primary hover:text-primary block px-5 py-2 text-base font-medium hover:bg-opacity-5"> {{cat.name}} </a>
                          {% endfor %}
                        </div>
                      </div>
                  </li>
                  <li class="" style="font-family: 'Open Sans', sans-serif;">
                    <a href="/about" class="relative text-sm text-dark hover:text-primary flex items-center gap-1 justify-between py-2 text-base font-medium lg:mx-5 lg:inline-flex lg:py-6 2xl:mx-6">  About Us </a>
                  </li>
                  <li class="" style="font-family: 'Open Sans', sans-serif;">
                    <a href="/contact" class="relative text-sm text-dark hover:text-primary flex items-center gap-1 justify-between py-2 text-base font-medium lg:mx-5 lg:inline-flex lg:py-6 2xl:mx-6">  Contact Us</a>
                  </li>
                </ul>
              </nav>
            </div>
          </div>

  
          <!-- search -->
          <div class="px-4 cursor-pointer max-w-[300px] min-h-[44px] w-full overflow-hidden" id="searchtab">
            <div class="flex gap-2 items-center justify-end relative z-0 w-full mt-[14px]">

                    d="M11.9334 0H1.64722C1.16111 0 0.772217 0.387097 0.772217 0.870968V11.129C0.772217 11.5935 1.16111 12 1.64722 12H11.8945C12.3806 12 12.7695 11.6129 12.7695 11.129V0.851613C12.8084 0.387097 12.4195 0 11.9334 0ZM4.33058 10.2H2.56112V4.49032H4.33058V10.2ZM3.43613 3.69677C2.85279 3.69677 2.40556 3.23226 2.40556 2.67097C2.40556 2.10968 2.87223 1.64516 3.43613 1.64516C4.00002 1.64516 4.46669 2.10968 4.46669 2.67097C4.46669 3.23226 4.03891 3.69677 3.43613 3.69677ZM11.039 10.2H9.26951V7.43226C9.26951 6.77419 9.25006 5.90323 8.33617 5.90323C7.40282 5.90323 7.26671 6.63871 7.26671 7.37419V10.2H5.49725V4.49032H7.22782V5.28387H7.24727C7.50005 4.81935 8.06394 4.35484 8.93895 4.35484C10.7473 4.35484 11.0779 5.51613 11.0779 7.10323V10.2H11.039Z">

                </svg>
              </a>
              <svg id="searchIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21l-4.343-4.343m0 0A8 8 0 1 0 5.343 5.343a8 8 0 0 0 11.314 11.314Z"/></svg>                

            </div>
  
            <div class="relative ">
              <div id="searchbox" class="searchbox absolute bg-white  top-[-25px] right-[-10000px] z-[99999] shadow w-[270px] mt-[-4px] rounded-full">
                <input class="px-6 py-2  outline-none rounded-full w-full" type="search" placeholder="Search here..">
                <svg id="closeSearch" class="absolute w-[25px] h-[25px] bg-white right-[14px] top-[9px]" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="none" stroke="#333333" stroke-width="2" d="m7 7l10 10M7 17L17 7"/></svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>


<script >

  // sidebar toggle 
  togglemenuIcon = document.getElementById("toggleIcon")
  menuBox = document.getElementById("navbarCollapse")
  searchIcon = document.getElementById("searchIcon")
  searchBox = document.getElementById("searchbox")
  closesearch = document.getElementById("closeSearch")


  togglemenuIcon.addEventListener("click", function() {
    menuBox.classList.toggle("active");
  });


  searchIcon.addEventListener("click", function() {
    searchBox.classList.toggle("active");
  });
  
  closesearch.addEventListener("click", function() {
    searchBox.classList.remove("active");
  });
</script>

<style>
  .menuBox.active{
    display: block !important;
    position: fixed;
    z-index: 9999;
    top: 64px;
    left: 7px;
  }
  .searchbox.active{
    right: 0px !important;
  }
  .hover-link:hover .link {
    display: block;
    z-index: 9999999999;
    top: 80px;
    opacity: 1;
}
</style>
