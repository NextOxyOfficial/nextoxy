<script>
  window.onscroll = function() {stickyheader()};
  var header = document.getElementById("stickyheader");
  var sticky = header.offsetTop;

  function stickyheader() {
    if (window.pageYOffset > sticky) {
      header.classList.add("sticky");
    } else {
      header.classList.remove("sticky");
    }
  }


  // search toggle 
  searchtab = document.getElementById("searchtab");
  closeSearch = document.getElementById("searchclose");
  searchbox = document.getElementById("searchbox");

  searchtab.addEventListener("click", function() {
    searchbox.classList.add("active");
  });
  closeSearch.addEventListener("click", function() {
    searchbox.classList.remove("active");
  });



  // sidebar toggle 
  sidemenuicon = document.getElementById("sideMenu")
  sidebar = document.getElementById("sidebar")
  closebar = document.getElementById("closemenubar")

  sidemenuicon.addEventListener("click", function() {
    sidebar.classList.toggle("active");
  });
  closebar.addEventListener("click", function() {
    sidebar.classList.remove("active");
  });
</script>

<style>
  .searchbox.active{
    display: flex !important;
  }
  .hover-link:hover .link{
    top: 73px !important;
    z-index: 9999;
    opacity: 1;
    transition: all .4s ease;
  }
  .sidebar.active{
    left: 0px ;
    transition: all .3s ease .3s;
    box-shadow: rgba(17, 17, 26, 0.1) 0px 8px 24px, rgba(17, 17, 26, 0.1) 0px 16px 56px, rgba(17, 17, 26, 0.1) 0px 24px 80px;
  }
</style>
