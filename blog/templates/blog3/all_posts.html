<section class="py-10">
  <div class="container mx-auto">
    <div class="-mx-4 flex flex-wrap justify-center">
      <div class="w-full px-4">
        <div class="mx-auto mb-[60px] max-w-[510px] text-center lg:mb-20">
          <h2 class="text-dark mb-4 text-3xl font-bold sm:text-4xl md:text-[40px]">Latest Posts  </h2>
        </div>
      </div>
    </div>
    <div class="-mx-4 flex flex-wrap">
      {% for post in posts %}
      <div class="w-full px-4 md:w-1/2 lg:w-1/3">
        <div class="mx-auto mb-10 max-w-[370px]">
          <div class="mb-4 overflow-hidden rounded">
            <img src="https://cdn.tailgrids.com/2.0/image/application/images/blogs/blog-01/image-01.jpg" alt="image" class="w-full" />
          </div>
          <div>
            <span class="bg-primary inline-block rounded px-4 py-1 text-center text-xs font-semibold leading-loose"> {{post.created_at}} </span>
            <h3>
              <a href="javascript:void(0)" class="text-dark hover:text-primary mb-4 inline-block text-xl font-semibold sm:text-2xl lg:text-xl xl:text-2xl">{{ post.title }}</a>
            </h3>
            <p class="text-body-color text-base">{{ post.meta }}</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
